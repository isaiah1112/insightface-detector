[project]
name = "insightface-detector"
version = "0.1.0"
description = "InsightFace-based face detection for Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "insightface>=0.7.1",
    "onnxruntime>=1.17.0",
    "opencv-python-headless>=4.9.0.0",
    "numpy>=1.24.0",
    "click>=8.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
insightface-detect = "insightface_detector.cli:main"
